name: native

permissions:
  contents: write

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build-native:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (x64)
        run: cmake -S native -B native/build/x64 -G "Visual Studio 17 2022" -A x64

      - name: Build (Release)
        run: cmake --build native/build/x64 --config Release

      - name: Show outputs
        shell: pwsh
        run: Get-ChildItem native/build/x64/Release | Format-Table Name, Length

      - name: Validate manifest XML
        shell: pwsh
        run: |
          [xml]$m = Get-Content native/packaging/AppxManifest.xml
          if (-not $m.Package) { throw "Bad manifest" }
          Write-Host "Manifest OK"

      - name: Stage distributable
        shell: pwsh
        run: |
          $out  = "native/build/x64/Release"
          $dist = "dist/native"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item "$out/LegacyMenuBridge.dll" $dist
          Copy-Item "$out/LegacyMenuBridge.exe" $dist
          Copy-Item "native/packaging/AppxManifest.xml" $dist
          Copy-Item "native/packaging/Assets" $dist -Recurse
          Copy-Item "native/packaging/register.ps1" $dist
          Copy-Item "native/packaging/unregister.ps1" $dist
          Compress-Archive -Path "$dist/*" -DestinationPath "dist/LegacyMenuBridge-native-x64.zip" -Force

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LegacyMenuBridge-native
          path: dist/LegacyMenuBridge-native-x64.zip

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/LegacyMenuBridge-native-x64.zip
