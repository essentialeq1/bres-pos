name: native

permissions:
  contents: write

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build-native:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure (Ninja, Release)
        run: cmake -S native -B native/build/x64 -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build native/build/x64

      - name: Show outputs
        shell: pwsh
        run: Get-ChildItem native/build/x64 | Format-Table Name, Length

      - name: Self-test enumeration (informational)
        shell: pwsh
        run: |
          & native/build/x64/LegacyMenuBridge.exe --selftest

      - name: Dump classic menu tree (informational)
        shell: pwsh
        run: |
          & native/build/x64/LegacyMenuBridge.exe --dump "$env:WINDIR\System32\notepad.exe" --show-shell

      - name: COM method smoke test
        shell: pwsh
        run: |
          & native/build/x64/LegacyMenuBridge.exe --comtest
          exit $LASTEXITCODE

      - name: Validate manifest XML
        shell: pwsh
        run: |
          [xml]$m = Get-Content native/packaging/AppxManifest.xml
          if (-not $m.Package) { throw "Bad manifest" }
          Write-Host "Manifest OK"

      - name: Stage distributable
        shell: pwsh
        run: |
          $tag  = $env:GITHUB_REF_NAME
          $out  = "native/build/x64"
          $dist = "dist/native"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item "$out/LegacyMenuBridge.dll" $dist
          Copy-Item "$out/LegacyMenuBridge.exe" $dist
          Copy-Item "native/packaging/AppxManifest.xml" $dist
          Copy-Item "native/packaging/Assets" $dist -Recurse
          Copy-Item "native/packaging/register.ps1" $dist
          Copy-Item "native/packaging/unregister.ps1" $dist
          Copy-Item "native/packaging/install.bat" $dist
          Copy-Item "native/packaging/uninstall.bat" $dist
          Copy-Item "native/packaging/diagnose.ps1" $dist
          Copy-Item "native/packaging/create-cert.ps1" $dist
          Copy-Item "native/packaging/sign.ps1" $dist
          Copy-Item "native/packaging/make-msix.ps1" $dist
          Copy-Item "native/packaging/INSTALL.txt" $dist
          Copy-Item "native/packaging/LegacyMenuBridge.blocklist.txt" $dist
          Compress-Archive -Path "$dist/*" -DestinationPath "dist/LegacyMenuBridge-native-x64-$tag.zip" -Force

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LegacyMenuBridge-native
          path: dist/*.zip

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: LegacyMenuBridge ${{ github.ref_name }}
          files: dist/LegacyMenuBridge-native-x64-${{ github.ref_name }}.zip
